server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = / {
        rewrite ^ /relax/index.html last;
    }

    location = /relax {
        return 302 /;
    }

    location = /relax/ {
        return 302 /;
    }

    # Inject classroom-mode assets into the upstream HTML without maintaining
    # a long-lived source-code fork.
    location = /relax/index.html {
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/relax/college-mode.css"></head>';
        sub_filter '</body>' '<script src="/relax/college-mode.js"></script></body>';
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /relax/ {
        try_files $uri $uri/ /relax/index.html;
    }

}
